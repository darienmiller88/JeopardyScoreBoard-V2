{{ define "title" }}Create Game{{ end }}

{{ define "css" }}
<link rel="stylesheet" href="../static/css/CreateGame.css">
{{ end }}

{{ define "content" }}
<div style="max-width: 56rem; margin: 0 auto;">
    <h1 class="gradient-text" style="text-align: center; font-size: 3rem; margin-bottom: 2rem;">Create New Game</h1>
    
    <div class="glass">
        <div style="margin-bottom: 2rem;">
            <label style="color: var(--primary); font-size: 1.25rem; display: block; margin-bottom: 0.75rem;">Choose Site:</label>
            <select style="font-size: 1.1rem; background: linear-gradient(to right, rgba(34,211,238,0.1), rgba(14,165,233,0.1));">
                <option>Flushing</option>
                <option>Pelham Bay</option>
                <option>Lawrence</option>
            </select>
        </div>

        <div style="margin-bottom: 2rem;">
            <h2 style="color: var(--primary); margin-bottom: 1rem;">
                Players Available: <span style="color: white;">3</span>
            </h2>
            
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div class="player-row">
                    <span style="font-size: 1.25rem; font-weight: 600;">Brandon S</span>
                    <button class="btn" style="background: linear-gradient(to right, #fbbf24, #f97316); color: #000; padding: 0.5rem 1rem;">
                        + Add To Game
                    </button>
                </div>
                </div>
        </div>

        <button class="btn btn-primary" 
                hx-get="/game/session" 
                hx-target="#main-content"
                style="width: 100%; font-size: 1.5rem; padding: 1.25rem;">
            ▶ Start Game!
        </button>
    </div>
</div>
{{ end }}
