{{ define "title" }}Create Game{{ end }}

{{ define "css" }}
<link rel="stylesheet" href="../static/css/CreateGame.css">
{{ end }}

{{ define "content" }}
<main class="container">
    <header style="text-align: center; margin: 2rem 0;">
        <h1>Game in Session</h1>
        <p style="color: var(--text-dim)">Total Points: <span style="color: var(--primary); font-size: 1.5rem;">4,200</span></p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn btn-outline" hx-post="/reset-all">Reset All</button>
            <button class="btn btn-outline">Sort by Score</button>
        </div>
    </header>

    <div class="player-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 20px;">
        <div class="card" style="text-align: center;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 style="margin: 0;">Brandon S</h3>
                <button class="btn-danger" style="padding: 4px 8px; font-size: 0.7rem; border-radius: 4px;">Remove</button>
            </div>
            
            <div style="font-size: 3rem; font-weight: bold; margin: 1rem 0;">1,200</div>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-danger" style="flex: 1; font-size: 1.5rem;">-</button>
                <button class="btn btn-primary" style="flex: 1; font-size: 1.5rem;">+</button>
            </div>
        </div>
    </div>

    <footer style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 1rem;">
         <button class="btn btn-danger">Close Game</button>
         <button class="btn btn-primary" style="background: var(--accent)">Save Game</button>
         <button class="btn btn-outline" style="background: var(--card-bg)">Add Players</button>
    </footer>
</main>
{{ end }}
