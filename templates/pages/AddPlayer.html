{{ define "title" }}Add Player{{ end }}

{{ define "css" }}
<link rel="stylesheet" href="../static/css/AddPlayer.css">
{{ end }}

{{ define "content" }}
<div class="container" style="max-width: 500px; margin: 40px auto; padding: 0 20px;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 2rem; color: var(--primary);">Add New Player</h2>
        
        <form hx-post="/players/add" hx-target="#player-list">
            <label style="color: var(--text-dim); font-size: 0.8rem; margin-bottom: 5px; display: block;">LOCATION</label>
            <select name="location">
                <option>Pelham Bay</option>
                <option>Flushing</option>
                <option>Lawrence</option>
            </select>

            <label style="color: var(--text-dim); font-size: 0.8rem; margin-bottom: 5px; display: block;">FIRST NAME</label>
            <input type="text" name="first_name" placeholder="e.g. Peter">

            <label style="color: var(--text-dim); font-size: 0.8rem; margin-bottom: 5px; display: block;">LAST NAME</label>
            <input type="text" name="last_name" placeholder="e.g. Parker">

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                Add Player to Location
            </button>
        </form>
    </div>

    <div id="player-list" style="margin-top: 2rem;">
        <h4 style="border-bottom: 1px solid #334155; padding-bottom: 10px; color: var(--text-dim);">
            Players at Pelham Bay
        </h4>
        <ul style="list-style: none; padding: 0;">
            <li style="padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between;">
                <span>Peter Parker</span>
                <span style="color: var(--primary); font-size: 0.8rem;">Ready</span>
            </li>
        </ul>
    </div>
</div>
{{ end }}
