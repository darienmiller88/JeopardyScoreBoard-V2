{{ define "title" }}Add Player{{ end }}

{{ define "css" }}
<link rel="stylesheet" href="../static/css/AddPlayer.css">
{{ end }}

{{ define "content" }}
<div class="add-player-container">
    <div class="glass">
        <h1 class="gradient-text add-player-header">Add New Player</h1>
        
        <form class="add-player-form" hx-post="/players/add" hx-target="#player-list">
            <label>Location</label>
            <select name="location">
                <option>Pelham Bay</option>
                <option>Lawrence</option>
            </select>

            <label>First Name</label>
            <input type="text" name="first" placeholder="e.g., Peter">

            <label>Last Name</label>
            <input type="text" name="last" placeholder="e.g., Parker">

            <button class="btn btn-primary">+ Add Player to Location</button>
        </form>

        <div class="player-list-section">
            <h3 class="player-list-header">
                👥 Players at Pelham Bay
            </h3>
            <div id="player-list" class="glass player-list-empty">
                No players added yet
            </div>
        </div>
    </div>
</div>
{{ end }}
