{{ define "title" }}Add Player{{ end }}

{{ define "css" }}
<link rel="stylesheet" href="../static/css/AddPlayer.css">
{{ end }}

{{ define "js" }}
<script>
    function showToast(message, type = 'success', duration = 2000) {
        const toast = document.getElementById('toast');
        
        const icons = {
            error: '✕',
            success: '✓',
            info: 'i',
            warning: '!'
        };
        
        const icon = icons[type] || '✓';
        
        toast.innerHTML = `
            <div class="toast-icon">${icon}</div>
            <span>${message}</span>
            <button class="toast-close" onclick="hideToast()">×</button>
        `;
        
        toast.className = 'toast ' + type;
        toast.classList.add('show');
        
        setTimeout(() => {
            toast.classList.remove('show');
        }, duration);
    }

    function hideToast() {
        const toast = document.getElementById('toast');
        toast.classList.remove('show');
    }
       
</script>
{{ end }}

{{ define "content" }}
<div class="add-player-container">
    <div class="glass form-container">
        <h1 class="gradient-text add-player-header">Add New Player</h1>
        
        <form 
            class="add-player-form"
            hx-post="/players" 
            hx-target="#player-list" 
            hx-swap="beforeend"
            hx-on::response-error="showToast(event.detail.xhr.responseText, 'error', 2000)"
            hx-on::after-request="
                if(event.detail.successful) {
                    showToast('Player added successfully!', 'success', 2000)
                }
            "
        >
            <label>Location</label>
            <select 
                name="location"
                hx-get="/players/by-location" 
                hx-target="#player-list-section-id" 
                hx-swap="outerHTML"
                hx-trigger="change"
            >
                {{ range .Locations }}
                <option {{ if eq . $.SelectedLocation }}selected{{ end }}>{{.}}</option>
                {{ end }}
            </select>
            <label>First Name</label>
            <input type="text" name="first" minlength="2" maxlength="20" placeholder="e.g., Peter" required>

            <label>Last Name</label>
            <input type="text" name="last"  minlength="2" maxlength="20" placeholder="e.g., Parker" required>

            <button type="submit" class="btn btn-primary">+ Add Player to Location</button>
        </form>
    </div>
    
    <button onclick="showToast('success', 'success', 2000)">
        Test Toast
    </button>
    <div id="player-list-section-id" class="player-list-section">
        <h3 class="player-list-header">
            👥 Players at {{ .SelectedLocation }}
        </h3>
        <div id="player-list">
            {{ range .Players }}
            <div class="player-card">
                <div class="player-avatar">{{ .PlayerNameAbbrev }}</div>
                <span class="player-name">{{ .PlayerName }}</span>
                <div class="player-card-actions">
                    <button class="btn-card btn-edit">✏️ Edit</button>
                    <button class="btn-card btn-delete">🗑️ Delete</button>
                </div>
            </div>
            {{ end }}
        </div>
    </div>
    
    <div id="toast" class="toast"></div>
</div>
{{ end }}
