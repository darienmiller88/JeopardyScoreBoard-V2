{{ define "title" }}Team Mode{{ end }}

{{ define "css" }}
<link rel="stylesheet" href="../static/css/TeamMode.css">
{{ end }}

{{ define "content" }}
<main class="container">
    <header style="text-align: center; margin: 2rem 0;">
        <h1 style="font-size: 2.5rem; margin-bottom: 10px;">Teams to Add</h1>
        <button class="btn btn-danger" style="padding: 0.5rem 2rem;">Reset All Points</button>
    </header>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; padding: 0 2rem;">
        
        <div class="card" style="border-top: 4px solid var(--accent); position: relative;">
            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem;">
                <h2 style="margin: 0;">Lawrence</h2>
                <div style="display: flex; gap: 5px;">
                    <button class="btn" style="background: #334155; font-size: 0.7rem; padding: 5px 10px;">Reset</button>
                    <button class="btn" style="background: #334155; font-size: 0.7rem; padding: 5px 10px;">Clear</button>
                </div>
            </div>

            <div style="display: flex; align-items: center; justify-content: center; gap: 20px; margin: 2rem 0;">
                <button class="btn btn-danger" style="width: 60px; height: 60px; font-size: 2rem; border-radius: 50%;">-</button>
                <span style="font-size: 4rem; font-weight: bold;">0</span>
                <button class="btn btn-primary" style="width: 60px; height: 60px; font-size: 2rem; border-radius: 50%;">+</button>
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn btn-outline" style="width: 100%;">View Players</button>
                <button class="btn btn-primary" style="width: 100%; background: var(--accent);">Add Player to Team</button>
            </div>
        </div>

        <div class="card" style="border-top: 4px solid var(--primary);">
            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem;">
                <h2 style="margin: 0;">Port Richmond</h2>
                <div style="display: flex; gap: 5px;">
                    <button class="btn" style="background: #334155; font-size: 0.7rem; padding: 5px 10px;">Reset</button>
                    <button class="btn" style="background: #334155; font-size: 0.7rem; padding: 5px 10px;">Clear</button>
                </div>
            </div>

            <div style="display: flex; align-items: center; justify-content: center; gap: 20px; margin: 2rem 0;">
                <button class="btn btn-danger" style="width: 60px; height: 60px; font-size: 2rem; border-radius: 50%;">-</button>
                <span style="font-size: 4rem; font-weight: bold;">0</span>
                <button class="btn btn-primary" style="width: 60px; height: 60px; font-size: 2rem; border-radius: 50%;">+</button>
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn btn-outline" style="width: 100%;">View Players</button>
                <button class="btn btn-primary" style="width: 100%;">Add Player to Team</button>
            </div>
        </div>

    </div>
</main>
{{ end }}
