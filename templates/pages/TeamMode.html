{{ define "title" }}Team Mode{{ end }}

{{ define "css" }}
<link rel="stylesheet" href="../static/css/TeamMode.css">
{{ end }}

{{ define "js" }}
{{ end }}

{{ define "content" }}
<div class="team-page-header" x-data="{ teamCount: 0 }">
    <h1 class="gradient-text">Team Battle</h1>
    <div class="team-page-header__select-row" x-show="teamCount < 2">
        <select id="team-select" class="team-card__select" name="teamName">
            {{ range .TeamNames }}
            <option value="{{ . }}">{{ . }}</option>
            {{ end }}
        </select>
        <button 
            class="team-card__btn-assign" 
            hx-include="#team-select" 
            hx-post="/teams/add-team"
            hx-target="#teams-target"
            hx-swap="beforeend"
            @htmx:after-request.window="teamCount++"
        >Assign</button>
    </div>
</div>
  
<!-- Team cards go here -->
<div 
    id="teams-target"
    class="team-grid"
>
    
</div>

<!-- View team players modal -->
<div id="viewTeamPlayersModal" class="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">View Team Players</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <h3 class="list-title">
                    Players
                </h3>
                <div id="team-players" class="player-names">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
    <!-- end of modal -->
</div>
<div class="team-page-footer">
    <button class="btn team-page__btn-save">Save Game</button>
</div>
{{ end }}
