{{ define "title" }}View Games{{ end }}

{{ define "css" }}
<link rel="stylesheet" href="../static/css/ViewGames.css">
{{ end }}

{{ define "js" }}
{{ end }}

{{ define "content" }}
<div class="page-wrapper">
    <h1 class="gradient-text page-title">Saved Games</h1>
    
    <div class="glass game-card">
        <div class="winner-section">
            <span class="star-icon">⭐</span>
            <p class="winner-label">WINNER</p>
            <h2 class="winner-name">Clark Kent</h2>
            <div class="winner-score">7009</div>
            <span class="star-icon">⭐</span>
        </div>

        <div class="stats-grid">
            <div class="glass stat-box">
                <div class="stat-value">10509</div>
                <div class="stat-label">TOTAL POINTS</div>
            </div>
            <div class="glass stat-box">
                <div class="stat-value">3503</div>
                <div class="stat-label">AVERAGE</div>
            </div>
        </div>

        <div class="action-row">
            <button 
                class="btn btn-primary" 
                data-bs-toggle="modal" 
                data-bs-target="#viewGamesModal"
            >View Players</button>
            <button class="btn btn-danger">Delete Game</button>
        </div>
    </div>

     <!-- Modal for Viewing Game -->
    <div id="viewGamesModal" class="modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">View Game</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h3>
                        Players
                    </h3>
                    <div class="player-names">

                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
        <!-- end of modal -->
    </div>
</div>
{{ end }}
