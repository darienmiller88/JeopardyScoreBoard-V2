{{ define "title" }}View Games{{ end }}

{{ define "css" }}
<link rel="stylesheet" href="../static/css/ViewGames.css">
{{ end }}

{{ define "js" }}
{{ end }}

{{ define "content" }}
<div class="page-wrapper">
    <h1 class="gradient-text page-title">Saved Games</h1>
    
    <div class="glass game-card">
        <div class="winner-section">
            <span class="star-icon">⭐</span>
            <p class="winner-label">WINNER</p>
            <h2 class="winner-name">Clark Kent</h2>
            <div class="winner-score">7009</div>
            <span class="star-icon">⭐</span>
        </div>

        <div class="stats-grid">
            <div class="glass stat-box">
                <div class="stat-value">10509</div>
                <div class="stat-label">TOTAL POINTS</div>
            </div>
            <div class="glass stat-box">
                <div class="stat-value">3503</div>
                <div class="stat-label">AVERAGE</div>
            </div>
        </div>

        <div class="action-row">
            <button class="btn btn-primary">View Players</button>
            <button class="btn btn-danger">Delete Game</button>
        </div>
    </div>
</div>
{{ end }}
