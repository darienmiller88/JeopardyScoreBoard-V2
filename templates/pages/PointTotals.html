{{ define "title" }}Talent Show{{ end }}

{{ define "css" }}
<link rel="stylesheet" href="../static/css/PointTotals.css">
{{ end }}

{{ define "js" }}{{ end }}

{{ define "content" }}
    <h1>
        Point Totals
    </h1>

    <h1 class="gradient-text" style="margin-bottom: 1.5rem;">Point Totals</h1>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem;">
        {{ range $judge, $totals := .JudgeScores }}
        <div class="glass">
            <h2 style="color: var(--primary); font-size: 1rem; font-weight: 700; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em;">{{ $judge }}</h2>
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                {{ range $totals }}
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--glass-border);">
                    <span style="color: var(--text-white); font-size: 0.9rem;">{{ .Name }}</span>
                    <span style="color: var(--primary); font-weight: 700; font-size: 1rem;">{{ printf "%.1f" .Score }}</span>
                </div>
                {{ end }}
            </div>
        </div>
        {{ end }}
    </div>
{{ end }}
