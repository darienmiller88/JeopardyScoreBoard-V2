{{ define "team_cards" }}
<div class="team-grid">
    {{ range . }}
    <div id="{{ .ID }}" class="glass team-card">
        <h2 class="team-card__name">{{ .TeamName }}</h2>
        <div class="team-card__actions">
            <button class="btn btn-reset">Reset</button>
            <button class="btn btn-clear">Clear</button>
        </div>

        <div class="glass score-counter">
            <button 
                class="btn score-counter__btn-decrement"
                hx-post="/teams/{{ .ID }}/minus-points"
                hx-target="#score-{{ .ID }}"
                hx-swap="outerHTML"
            >-</button>
            <span id="score-{{ .ID }}" class="score-counter__value">{{ .Score }}</span>
            <button 
                class="btn score-counter__btn-increment"
                hx-post="/teams/{{ .ID }}/add-points"
                hx-target="#score-{{ .ID }}"
                hx-swap="outerHTML"
            >+</button>
        </div>

        <input 
            id="points-input-{{ .ID }}"
            name="points"
            type="number"
            class="team-card__points-input"
            placeholder="Points"
            min="0"
        />

        <button 
            class="btn team-card__btn-view-players"
            data-bs-toggle="modal" 
            data-bs-target="#viewTeamPlayersModal"
            hx-get="/teams/{{ .ID }}"        
            hx-target="#team-players"
            hx-swap="outerHTML"
        >View Players</button>
        <button class="btn btn-primary team-card__btn-add-player">Add Player to Team</button>
    </div>
    {{ end }}
</div>
{{ end }}
