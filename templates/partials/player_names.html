{{ define "player_names" }}
<div id="player-names-for-player-modal" class="player-names">
    {{ range $i, $player := .Players }}
    <div id="{{ $player.ID }}" class="player-item">
        <span class="player-number">{{ $i }}</span>
        <span class="player-item-name">{{ $player.PlayerName }}</span>
        <span class="player-item-score">{{ $player.Score }}</span>
    </div>
    {{ end }}
</div>
{{ end }}
